const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2);
const fmtDur = (m,s) => `${m}:${String(s).padStart(2,'0')}`;
const parseDur = str => { const [m,s]=(str||'0:00').split(':'); return[parseInt(m)||0,parseInt(s)||0]; };
const avgRating = ts => { const r=ts.filter(t=>t.rating>0); if(!r.length)return null; return(r.reduce((a,t)=>a+t.rating,0)/r.length).toFixed(1); };
const lsGet = (k,d) => { try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch{return d;} };
const lsSet = (k,v) => { try{localStorage.setItem(k,JSON.stringify(v));}catch(e){console.warn('lsSet failed:',k,e);} };

// Compress image to max ~200px and quality 0.6 before storing
const compressImage = (dataUrl, maxSize=200, quality=0.6) => new Promise(resolve => {
  if(!dataUrl || !dataUrl.startsWith('data:image')){resolve(dataUrl);return;}
  const img = new Image();
  img.onload = () => {
    const scale = Math.min(1, maxSize/Math.max(img.width, img.height));
    const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
    const c = document.createElement('canvas'); c.width=w; c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    resolve(c.toDataURL('image/jpeg', quality));
  };
  img.onerror = ()=>resolve(dataUrl);
  img.src = dataUrl;
});

const SUPERLATIVES = [
  {key:'star', icon:'⭐', label:'Most famous'},
  {key:'fav1', icon:'🥇', label:'#1 favorite'},
  {key:'fav2', icon:'🥈', label:'#2 favorite'},

// ── Half-Star Rating ──────────────────────────────────────────────────────────
function HalfStars({n, set, fav, size='.95rem'}) {
  const val = n||0;
  return (
    <div style={{display:'flex',gap:1,alignItems:'center',cursor:set?'pointer':'default'}}>
      {[1,2,3,4,5].map(i=>{
        const full = val>=i;
        const half = val>=i-0.5 && val<i;
        const symbol = full?'★':(half?'⯨':'☆');
        return (
          <span key={i} className="star-half-wrap" style={{fontSize:size}}
            onClick={set?(e=>{
              const rect=e.currentTarget.getBoundingClientRect();
              const clickX=e.clientX-rect.left;
              const isLeftHalf=clickX < rect.width/2;
              set(isLeftHalf ? i-0.5 : i);
            }):undefined}
          >
            <span style={{position:'absolute',color:P.muted+'88'}}>☆</span>
            {full&&<span style={{position:'absolute',color:P.rose}}>★</span>}
            {half&&<span style={{position:'absolute',overflow:'hidden',width:'50%',color:P.rose}}>★</span>}
          </span>
        );
      })}
      <span style={{fontSize:'.72rem',color:P.textMid,marginLeft:4}}>{val>0?val.toFixed(1):''}</span>
      {fav&&<span style={{color:P.rose,fontSize:'.85rem',marginLeft:2}}>♥</span>}
    </div>
  );
}

function CoverBox({src, onUpload, size=80, radius=8}) {
  return (
    <div>
      {src?<img src={src} style={{width:size,height:size,borderRadius:radius,objectFit:'cover',display:'block'}} alt="cover"/>
          :<div style={{width:size,height:size,borderRadius:radius,background:P.blush,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'2rem',color:P.muted}}>♪</div>}
      {onUpload&&<label className="upload-lbl" style={{marginTop:6,padding:'.4rem'}}>
        {src?'Change':'Upload image'}
        <input type="file" accept="image/*" style={{display:'none'}} onChange={e=>{
          const f=e.target.files[0];if(!f)return;
          const r=new FileReader();r.onload=ev=>onUpload(ev.target.result);r.readAsDataURL(f);
        }}/>
      </label>}
    </div>
  );
}

function Toggle({on, onChange, label}) {

    <div className="toggle-row">
      <div className={`toggle-switch${on?' on':''}`} onClick={()=>onChange(!on)}><div className="toggle-knob"/></div>

}

// ── Tag Input ─────────────────────────────────────────────────────────────────
function TagInput({values, onChange, suggestions, placeholder, colorMap}) {
  const [input, setInput] = useState('');
  const [showSug, setShowSug] = useState(false);
  const wrapRef = useRef();
  const filtered = suggestions.filter(s => s.toLowerCase().includes(input.toLowerCase()) && !values.includes(s));
  const add = val => { const v=val.trim(); if(v&&!values.includes(v))onChange([...values,v]); setInput(''); setShowSug(false); };
  const remove = v => onChange(values.filter(x=>x!==v));
  return (
    <div style={{position:'relative'}} ref={wrapRef}>
      <div className="tag-input-wrap" onClick={()=>wrapRef.current.querySelector('input').focus()}>
        {values.map(v=>(
          <span key={v} className="tag-pill" style={colorMap?{background:colorMap[v]+'22',color:colorMap[v],borderColor:colorMap[v]+'55'}:{}}>
            {v}<button onClick={e=>{e.stopPropagation();remove(v);}}>×</button>
          </span>
        ))}
        <input className="tag-inline-input" value={input} placeholder={values.length===0?placeholder:''}
          onChange={e=>{setInput(e.target.value);setShowSug(true);}}
          onFocus={()=>setShowSug(true)}
          onBlur={()=>setTimeout(()=>setShowSug(false),150)}
          onKeyDown={e=>{
            if(e.key==='Enter'||e.key===','){e.preventDefault();if(input.trim())add(input);}
            if(e.key==='Backspace'&&!input&&values.length)remove(values[values.length-1]);
          }}/>
      </div>
      {showSug&&(input||filtered.length>0)&&(
        <div className="tag-suggestions">
          {filtered.map(s=><div key={s} className="tag-suggestion-item" onMouseDown={()=>add(s)}>{s}</div>)}
          {input.trim()&&!suggestions.includes(input.trim())&&<div className="tag-suggestion-item" style={{color:P.rose,fontWeight:700}} onMouseDown={()=>add(input)}>+ Create "{input.trim()}"</div>}
        </div>
      )}
    </div>
  );
}

function DrumPicker({value, onChange}) {
  const [m,s] = parseDur(value);
  const mins=Array.from({length:60},(_,i)=>i), secs=Array.from({length:60},(_,i)=>i);
  const mRef=useRef(), sRef=useRef();
  useEffect(()=>{if(mRef.current)mRef.current.scrollTop=m*40;},[]);
  useEffect(()=>{if(sRef.current)sRef.current.scrollTop=s*40;},[]);
  const onSM=()=>{if(!mRef.current)return;onChange(fmtDur(Math.round(mRef.current.scrollTop/40),s));};
  const onSS=()=>{if(!sRef.current)return;onChange(fmtDur(m,Math.round(sRef.current.scrollTop/40)));};
  return (
    <div>

const sortTracks=(tracks,by)=>{
  const a=[...tracks];
  if(by==='manual') return a; // assumes pre-sorted via order field
  if(by==='az') a.sort((a,b)=>a.title.localeCompare(b.title));
  else if(by==='za') a.sort((a,b)=>b.title.localeCompare(a.title));
  else if(by==='rating-hi') a.sort((a,b)=>(b.rating||0)-(a.rating||0));
  else if(by==='rating-lo') a.sort((a,b)=>(a.rating||0)-(b.rating||0));
  else if(by==='dur-hi') a.sort((a,b)=>{const[am,as]=parseDur(a.duration);const[bm,bs]=parseDur(b.duration);return(bm*60+bs)-(am*60+as);});
  else if(by==='dur-lo') a.sort((a,b)=>{const[am,as]=parseDur(a.duration);const[bm,bs]=parseDur(b.duration);return(am*60+as)-(bm*60+bs);});
  else a.sort((a,b)=>String(b.id).localeCompare(String(a.id)));
  return a;
};

          {(t.moods||[]).map(m=><span key={m} className="tag" style={{background:(moodColors[m]||P.rose)+'22',color:moodColors[m]||P.rose,borderColor:(moodColors[m]||P.rose)+'66'}}>{m}</span>)}
        </div>
        {t.lyrics&&<div style={{fontSize:'.78rem',color:P.textMid,marginTop:4,fontStyle:'italic'}}>"{t.lyrics.slice(0,80)}{t.lyrics.length>80?'...':''}"</div>}
        {showSuperlativePicker&&<SuperlativePicker track={t} onToggle={key=>onToggleSuperlative(ri,key)}/>}
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:6,flexShrink:0,alignItems:'flex-end'}}>
        <button className="heart-btn" style={{color:t.favorite?P.rose:P.muted+'66'}} onClick={e=>{e.stopPropagation();onHeart(ri);}}>{t.favorite?'♥':'♡'}</button>
        <button className="btn-sec btn-sm" onClick={e=>{e.stopPropagation();onEdit(ri);}}>Edit</button>
        <button style={{background:'none',border:`1px solid ${P.rose}`,borderRadius:8,padding:'.3rem .6rem',fontSize:'.72rem',color:P.rose,cursor:'pointer'}} onClick={e=>{e.stopPropagation();onDel(ri);}}>Del</button>
      </div>
    </div>
  );
}

// ── Main App ──────────────────────────────────────────────────────────────────
function App() {
  const [tracks,setTracks]=useState(()=>lsGet('vl_tracks',[]));
  const [artists,setArtists]=useState(()=>lsGet('vl_artists',[]));
  const [albums,setAlbums]=useState(()=>lsGet('vl_albums',[]));
  const [playlists,setPlaylists]=useState(()=>lsGet('vl_playlists',[]));
  const [moods,setMoods]=useState(()=>lsGet('vl_moods',['Chill','Hype','Sad','Happy','Nostalgic','Romantic','Angry','Focus']));
  const [moodColors,setMoodColors]=useState(()=>lsGet('vl_moodColors',Object.fromEntries(['Chill','Hype','Sad','Happy','Nostalgic','Romantic','Angry','Focus'].map((m,i)=>([m,MOODPALETTE[i]])))));
  const [genres,setGenres]=useState(()=>lsGet('vl_genres',['Pop','R&B','Hip-Hop','Rock','Jazz','Electronic','Classical','Folk','Alternative','Soul','Latin','Indie']));

  const [tab,setTab]=useState('dashboard');
  const [showTrack,setShowTrack]=useState(false);
  const [showArtist,setShowArtist]=useState(false);
  const [showAlbum,setShowAlbum]=useState(false);
  const [showPlaylist,setShowPlaylist]=useState(false);
  const [showMoods,setShowMoods]=useState(false);
  const [editTrack,setEditTrack]=useState(null);
  const [editArtist,setEditArtist]=useState(null);
  const [editAlbum,setEditAlbum]=useState(null);
  const [editPlaylist,setEditPlaylist]=useState(null);
  const [selected,setSelected]=useState(null);
  const [search,setSearch]=useState('');
  const [trackSort,setTrackSort]=useState('newest');
  const [filterGenre,setFilterGenre]=useState('');
  const [filterMood,setFilterMood]=useState('');
  const [filterFav,setFilterFav]=useState(false);
  const [artistSort,setArtistSort]=useState('az');
  const [albumSort,setAlbumSort]=useState('az');
  const [playlistSort,setPlaylistSort]=useState('newest');
  const [openPlaylist,setOpenPlaylist]=useState(null);
  const [openAlbum,setOpenAlbum]=useState(null);
  const [openArtist,setOpenArtist]=useState(null);
  const [artistInnerTab,setArtistInnerTab]=useState('tracks');
  const [saveBadge,setSaveBadge]=useState(false);
  const [showTrackForAlbum,setShowTrackForAlbum]=useState(null);
  const [dragTrack,setDragTrack]=useState(null);
  const [albumTrackSort,setAlbumTrackSort]=useState('manual');
  const [superlativeFilter,setSuperlativeFilter]=useState('');

  useEffect(()=>{lsSet('vl_tracks',tracks);},[tracks]);
  useEffect(()=>{lsSet('vl_artists',artists);},[artists]);
  useEffect(()=>{lsSet('vl_albums',albums);},[albums]);
  useEffect(()=>{lsSet('vl_playlists',playlists);},[playlists]);
  useEffect(()=>{lsSet('vl_moods',moods);},[moods]);
  useEffect(()=>{lsSet('vl_moodColors',moodColors);},[moodColors]);
  useEffect(()=>{lsSet('vl_genres',genres);},[genres]);

  const flash=()=>{setSaveBadge(true);setTimeout(()=>setSaveBadge(false),1800);};

  const ensureArtists=names=>{
    setArtists(prev=>{
      let u=[...prev];
      names.forEach(name=>{if(name&&!u.find(a=>a.name.toLowerCase()===name.toLowerCase()))u.push({id:uid(),name,bio:'',photo:null,members:[],autoCreated:true});});
      return u;
    });
  };

  const ensureAlbum=(albumTitle, albumCover, artistNames)=>{
    if(!albumTitle.trim()) return null;
    let existing=albums.find(a=>a.title.toLowerCase()===albumTitle.trim().toLowerCase());
    if(existing){
      if(albumCover&&!existing.cover){setAlbums(prev=>prev.map(a=>a.id===existing.id?{...a,cover:albumCover}:a));}
      return existing.id;
    }
    const newId=uid();
    const artist=artistNames[0]||'';
    setAlbums(prev=>[...prev,{id:newId,title:albumTitle.trim(),artist,year:'',cover:albumCover||null,notes:''}]);
    ensureArtists([artist].filter(Boolean));
    return newId;
  };

  const addGenre=g=>{if(!genres.includes(g))setGenres(p=>[...p,g]);};
  const addMood=m=>{if(!moods.includes(m)){setMoods(p=>[...p,m]);setMoodColors(prev=>({...prev,[m]:MOODPALETTE[Object.keys(prev).length%MOODPALETTE.length]}));}};

  const saveTrack=async f=>{
    const al=[...(f.artists||[]),...(f.featArtists||[])];
    ensureArtists(al);
    const albumId=ensureAlbum(f.albumTitle||'', f.albumCover||null, f.artists||[]);
    const rawCover=f.cover||(albumId?albums.find(a=>a.id===albumId)?.cover:null)||null;
    const rawAlbumCover=f.albumCover||null;
    const [cover, albumCoverCompressed] = await Promise.all([compressImage(rawCover), compressImage(rawAlbumCover)]);
    // update album cover if compressed
    if(albumId && albumCoverCompressed){setAlbums(p=>p.map(a=>a.id===albumId?{...a,cover:albumCoverCompressed}:a));}
    const finalTrack={...f,album:albumId,cover,albumCover:undefined};
    if(editTrack!=null){setTracks(p=>p.map((t,i)=>i===editTrack?{...finalTrack,id:t.id,order:t.order,superlatives:t.superlatives}:t));setSelected(editTrack);}
    else{setTracks(p=>[...p,{...finalTrack,id:uid(),order:p.length,superlatives:{}}]);setSelected(tracks.length);}
    setEditTrack(null);flash();
  };

  const saveArtist=async f=>{
    const photo = await compressImage(f.photo);
    const members = await Promise.all((f.members||[]).map(async m=>({...m,photo:await compressImage(m.photo)})));
    const final={...f,photo,members};
    if(editArtist!=null) setArtists(p=>p.map((a,i)=>i===editArtist?{...final,id:a.id}:a));
    else setArtists(p=>[...p,{...final,id:uid()}]);
    setEditArtist(null);flash();
  };

  const saveAlbum=async f=>{
    const cover=await compressImage(f.cover);
    const final={...f,cover};
    if(editAlbum!=null){
      const aid=albums[editAlbum].id;
      setAlbums(p=>p.map((a,i)=>i===editAlbum?{...final,id:a.id}:a));
      setTracks(p=>p.map(t=>t.album===aid&&!t.cover?{...t,cover}:t));
    } else {
      setAlbums(p=>[...p,{...final,id:uid()}]);
      ensureArtists([f.artist].filter(Boolean));
    }
    setEditAlbum(null);flash();
  };

  const savePlaylist=f=>{
    if(editPlaylist!=null) setPlaylists(p=>p.map((pl,i)=>i===editPlaylist?{...f,id:pl.id}:pl));
    else setPlaylists(p=>[...p,{...f,id:uid()}]);
    setEditPlaylist(null);flash();
  };

  const delTrack=i=>{setTracks(p=>p.filter((_,j)=>j!==i));if(selected===i)setSelected(null);flash();};
  const delArtist=i=>{setArtists(p=>p.filter((_,j)=>j!==i));flash();};
  const delAlbum=i=>{setAlbums(p=>p.filter((_,j)=>j!==i));flash();};
  const delPlaylist=i=>{setPlaylists(p=>p.filter((_,j)=>j!==i));flash();};
  const toggleHeart=i=>{setTracks(p=>p.map((t,j)=>j===i?{...t,favorite:!t.favorite,rating:!t.favorite?5:t.rating}:t));flash();};
  const updateMoods=(nm,nc)=>{setMoods(nm);setMoodColors(nc);flash();};
  const toggleSuperlative=(idx,key)=>{
    setTracks(p=>p.map((t,j)=>j===idx?{...t,superlatives:{...(t.superlatives||{}),[key]:!t.superlatives?.[key]}}:t));
    flash();
  };

  // Drag-drop reordering (within album view only)
  const handleDragStart=(e,t)=>{setDragTrack(t);};
  const handleDragOver=(e)=>{e.preventDefault();};
  const handleDrop=(e,targetTrack)=>{
    e.preventDefault();
    if(!dragTrack||dragTrack.id===targetTrack.id)return;
    setTracks(prev=>{
      const arr=[...prev];
      const fromIdx=arr.findIndex(t=>t.id===dragTrack.id);
      const toIdx=arr.findIndex(t=>t.id===targetTrack.id);
      const [moved]=arr.splice(fromIdx,1);
      arr.splice(toIdx,0,moved);
      // reassign order sequentially for all tracks (only matters within shared album context but fine globally)
      return arr.map((t,i)=>({...t,order:i}));
    });
    setDragTrack(null);flash();
  };

  const filteredTracks=useMemo(()=>{
    let arr=tracks.filter(t=>{
      const q=search.toLowerCase();
      return(!q||t.title.toLowerCase().includes(q)||(t.artists||[]).some(a=>a.toLowerCase().includes(q)))
        &&(!filterGenre||(t.genres||[]).includes(filterGenre))
        &&(!filterMood||(t.moods||[]).includes(filterMood))
        &&(!filterFav||t.favorite);
    });
    return sortTracks(arr,trackSort);
  },[tracks,search,filterGenre,filterMood,filterFav,trackSort]);

  const genreCount=useMemo(()=>{const m={};tracks.forEach(t=>(t.genres||[]).forEach(g=>{m[g]=(m[g]||0)+1;}));return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,6);},[tracks]);
  const genreAvg=useMemo(()=>{const acc={};tracks.forEach(t=>{if(!t.rating)return;(t.genres||[]).forEach(g=>{if(!acc[g])acc[g]={sum:0,n:0};acc[g].sum+=t.rating;acc[g].n++;});});return Object.entries(acc).map(([g,{sum,n}])=>([g,(sum/n).toFixed(1)])).sort((a,b)=>b[1]-a[1]);},[tracks]);
  const moodAvg=useMemo(()=>{const acc={};tracks.forEach(t=>{if(!t.rating)return;(t.moods||[]).forEach(m=>{if(!acc[m])acc[m]={sum:0,n:0};acc[m].sum+=t.rating;acc[m].n++;});});return Object.entries(acc).map(([m,{sum,n}])=>([m,(sum/n).toFixed(1)])).sort((a,b)=>b[1]-a[1]);},[tracks]);
  const moodCount=useMemo(()=>{const m={};tracks.forEach(t=>(t.moods||[]).forEach(g=>{m[g]=(m[g]||0)+1;}));return m;},[tracks]);
  const ratingDist=useMemo(()=>{
    const buckets={};
    tracks.forEach(t=>{if(t.rating>0){const r=Math.round(t.rating*2)/2;buckets[r]=(buckets[r]||0)+1;}});
    return Object.entries(buckets).sort((a,b)=>parseFloat(b[0])-parseFloat(a[0]));
  },[tracks]);
  const maxGenre=genreCount[0]?genreCount[0][1]:1;

  const selTrack=selected!=null?tracks[selected]:null;
  const similar=selTrack?tracks.filter((_,i)=>i!==selected&&(
    (selTrack.moods||[]).some(m=>(tracks[i].moods||[]).includes(m))||
    (selTrack.genres||[]).some(g=>(tracks[i].genres||[]).includes(g))||
    Math.abs((tracks[i].rating||0)-(selTrack.rating||0))<=1
  )).map(t=>{const idx=tracks.indexOf(t);const shared=[...(selTrack.moods||[]).filter(m=>(t.moods||[]).includes(m)),...(selTrack.genres||[]).filter(g=>(t.genres||[]).includes(g))];return{t,idx,shared};}).slice(0,8):[];

  const artAvg=name=>avgRating(tracks.filter(t=>(t.artists||[]).some(n=>n.toLowerCase()===name.toLowerCase())));

  const sortedArtists=useMemo(()=>{
    const arr=[...artists];
    if(artistSort==='az') arr.sort((a,b)=>a.name.localeCompare(b.name));
    else if(artistSort==='za') arr.sort((a,b)=>b.name.localeCompare(a.name));
    else if(artistSort==='tracks') arr.sort((a,b)=>tracks.filter(t=>(t.artists||[]).some(n=>n.toLowerCase()===b.name.toLowerCase())).length-tracks.filter(t=>(t.artists||[]).some(n=>n.toLowerCase()===a.name.toLowerCase())).length);
    else if(artistSort==='rating') arr.sort((a,b)=>(parseFloat(artAvg(b.name))||0)-(parseFloat(artAvg(a.name))||0));
    return arr;
  },[artists,artistSort,tracks]);

  const sortedAlbums=useMemo(()=>{
    const arr=[...albums];
    if(albumSort==='az') arr.sort((a,b)=>a.title.localeCompare(b.title));
    else if(albumSort==='za') arr.sort((a,b)=>b.title.localeCompare(a.title));
    else if(albumSort==='year-new') arr.sort((a,b)=>(parseInt(b.year)||0)-(parseInt(a.year)||0));
    else if(albumSort==='year-old') arr.sort((a,b)=>(parseInt(a.year)||0)-(parseInt(b.year)||0));
    else if(albumSort==='rating') arr.sort((a,b)=>(parseFloat(avgRating(tracks.filter(t=>t.album===b.id)))||0)-(parseFloat(avgRating(tracks.filter(t=>t.album===a.id)))||0));
    return arr;
  },[albums,albumSort,tracks]);

  const sortedPlaylists=useMemo(()=>{
    const arr=[...playlists];
    if(playlistSort==='az') arr.sort((a,b)=>a.name.localeCompare(b.name));
    else if(playlistSort==='za') arr.sort((a,b)=>b.name.localeCompare(a.name));
    else if(playlistSort==='size') arr.sort((a,b)=>(b.trackIds||[]).length-(a.trackIds||[]).length);
    else arr.sort((a,b)=>String(b.id).localeCompare(String(a.id)));
    return arr;
  },[playlists,playlistSort]);

  const TABS=['dashboard','tracks','albums','artists','playlists','settings'];

  const TrackSortSelect=({val,onChange,withManual})=>(
    <select className="select-bar" value={val} onChange={e=>onChange(e.target.value)}>
      {withManual&&<option value="manual">Custom order</option>}
      <option value="newest">Newest</option>
      <option value="az">A → Z</option>
      <option value="za">Z → A</option>
      <option value="rating-hi">Rating ↓</option>
      <option value="rating-lo">Rating ↑</option>
      <option value="dur-hi">Duration ↓</option>
      <option value="dur-lo">Duration ↑</option>
    </select>
  );

  return(
    <>
      <style>{css}</style>
      <div className="app">
        <div className="header">
          <div className="vinyl-icon"/>
          <h1>Vinyl</h1>
          <span style={{color:P.muted,fontSize:'.8rem',letterSpacing:2,marginLeft:'auto'}}>YOUR MUSIC LIBRARY</span>
        </div>
        <div className="nav">
          {TABS.map(t=>(
            <button key={t} className={tab===t?'active':''} onClick={()=>{setTab(t);setOpenPlaylist(null);setOpenAlbum(null);setOpenArtist(null);setArtistInnerTab('tracks');}}>
              {t.charAt(0).toUpperCase()+t.slice(1)}
            </button>
          ))}
        </div>

        <div className="main">

          {tab==='dashboard'&&<>
            <div className="stats-grid">
              <div className="stat-card"><div className="num">{tracks.length}</div><div className="lbl">Tracks</div></div>
              <div className="stat-card"><div className="num">{artists.length}</div><div className="lbl">Artists</div></div>
              <div className="stat-card"><div className="num">{albums.length}</div><div className="lbl">Albums</div></div>
              <div className="stat-card"><div className="num">{avgRating(tracks)||'-'}</div><div className="lbl">Avg ★</div></div>
              <div className="stat-card"><div className="num">{tracks.filter(t=>t.favorite).length}</div><div className="lbl">Favs ♥</div></div>
              <div className="stat-card"><div className="num">{[...new Set(tracks.flatMap(t=>t.genres||[]))].length}</div><div className="lbl">Genres</div></div>
            </div>
            <div className="charts-row">
              <div className="chart-card" style={{marginBottom:0}}>
                <h3>Top Genres</h3>
                {genreCount.length===0?<div style={{color:P.textLt,fontSize:'.85rem',fontStyle:'italic'}}>Add tracks to see breakdown</div>:
                genreCount.map(([g,n])=><div key={g} className="bar-row"><span className="bar-label">{g}</span><div className="bar-fill" style={{width:`${(n/maxGenre)*100}px`}}/><span className="bar-val">{n}</span></div>)}
              </div>
              <div className="chart-card" style={{marginBottom:0}}>
                <h3>Rating Distribution</h3>
                {ratingDist.length===0?<div style={{color:P.textLt,fontSize:'.85rem',fontStyle:'italic'}}>Rate tracks to see distribution</div>:
                ratingDist.map(([r,n])=><div key={r} className="bar-row">
                  <span className="bar-label">★{r}</span>
                  <div className="bar-fill" style={{width:`${(n/(tracks.length||1))*100}px`,background:P.dark}}/>
                  <span className="bar-val" style={{color:P.dark}}>{n}</span>
                </div>)}
              </div>
            </div>
            <div className="charts-row">
              <div className="chart-card" style={{marginBottom:0}}>
                <h3>Avg. Rating by Genre</h3>
                {genreAvg.length===0?<div style={{color:P.textLt,fontSize:'.85rem',fontStyle:'italic'}}>Rate tracks to see averages</div>:
                genreAvg.map(([g,avg])=><div key={g} className="bar-row">
                  <span className="bar-label">{g}</span>
                  <div style={{flex:1,background:P.blush,borderRadius:4,height:16,overflow:'hidden'}}><div style={{width:`${(parseFloat(avg)/5)*100}%`,height:'100%',background:`linear-gradient(90deg,${P.muted},${P.rose})`,borderRadius:4}}/></div>
                  <span style={{color:P.rose,fontWeight:700,fontSize:'.78rem',minWidth:32}}>★{avg}</span>
                </div>)}
              </div>
              <div className="chart-card" style={{marginBottom:0}}>
                <h3>Avg. Rating by Mood</h3>
                {moodAvg.length===0?<div style={{color:P.textLt,fontSize:'.85rem',fontStyle:'italic'}}>Rate tracks to see averages</div>:
                moodAvg.map(([m,avg])=><div key={m} className="bar-row">
                  <span className="bar-label">{m}</span>
                  <div style={{flex:1,background:P.blush,borderRadius:4,height:16,overflow:'hidden'}}><div style={{width:`${(parseFloat(avg)/5)*100}%`,height:'100%',background:moodColors[m]||P.rose,borderRadius:4,opacity:.8}}/></div>
                  <span style={{color:moodColors[m]||P.rose,fontWeight:700,fontSize:'.78rem',minWidth:32}}>★{avg}</span>
                </div>)}
              </div>
            </div>
            <div className="chart-card">
              <h3>Mood Map</h3>
              <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
                {moods.map(m=>(
                  <div key={m} style={{display:'flex',alignItems:'center',gap:6,padding:'4px 12px',borderRadius:20,background:(moodColors[m]||P.rose)+'22',border:`1.5px solid ${moodColors[m]||P.rose}`}}>
                    <div style={{width:10,height:10,borderRadius:'50%',background:moodColors[m]||P.rose}}/>
                    <span style={{fontSize:'.8rem',color:P.text,fontWeight:700}}>{m}</span>
                    <span style={{fontSize:'.8rem',color:P.textMid}}>{moodCount[m]||0}</span>
                  </div>
                ))}
              </div>
            </div>
          </>}

          {tab==='tracks'&&<>
            <div className="section-head">
              <h2>My Tracks</h2>
              <button className="btn-primary" onClick={()=>{setEditTrack(null);setShowTrack(true);}}>+ Add Track</button>
            </div>
            <div className="controls-row">
              <input className="search-bar" placeholder="Search title or artist..." value={search} onChange={e=>setSearch(e.target.value)}/>
              <TrackSortSelect val={trackSort} onChange={setTrackSort}/>
              <select className="select-bar" value={filterGenre} onChange={e=>setFilterGenre(e.target.value)}>
                <option value="">All genres</option>
                {genres.map(g=><option key={g} value={g}>{g}</option>)}
              </select>
              <select className="select-bar" value={filterMood} onChange={e=>setFilterMood(e.target.value)}>
                <option value="">All moods</option>
                {moods.map(m=><option key={m} value={m}>{m}</option>)}
              </select>
              <button className="btn-sec btn-sm" style={filterFav?{background:P.rose,color:P.cream,borderColor:P.rose}:{}} onClick={()=>setFilterFav(p=>!p)}>♥ Favs</button>
            </div>
            {filteredTracks.length===0&&<div className="empty">{tracks.length===0?'No tracks yet — add your first one!':'No results found.'}</div>}
            <div className="track-list">
              {filteredTracks.map(t=>{const ri=tracks.indexOf(t);return<TrackRow key={t.id} t={t} ri={ri} selected={selected===ri} onSelect={i=>setSelected(selected===i?null:i)} onEdit={i=>{setEditTrack(i);setShowTrack(true);}} onDel={delTrack} onHeart={toggleHeart} moodColors={moodColors} albums={albums} onToggleSuperlative={toggleSuperlative}/>;})}
            </div>
            {selTrack&&<div className="similar-panel">
              <h3>Similar to "{selTrack.title}"</h3>
              {similar.length===0?<div style={{color:P.muted,fontSize:'.85rem',fontStyle:'italic'}}>No similar tracks yet!</div>:
              <div className="similar-grid">
                {similar.map(({t,idx,shared})=>(
                  <div key={t.id} className="similar-card" onClick={()=>setSelected(idx)}>
                    <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:4}}>
                      {(t.cover||albums.find(a=>a.id===t.album)?.cover)?<img src={t.cover||albums.find(a=>a.id===t.album)?.cover} style={{width:32,height:32,borderRadius:4,objectFit:'cover'}} alt=""/>:
                        <div style={{width:32,height:32,borderRadius:4,background:P.rose+'44',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'1rem',color:P.muted}}>♪</div>}
                      <div><div className="s-title">{t.title}</div><div className="s-sub">{(t.artists||[]).join(', ')}</div></div>
                    </div>
                    <div className="s-match">{shared.slice(0,3).join(' · ')||'Similar rating'}</div>
                  </div>
                ))}
              </div>}
            </div>}
          </>}

          {tab==='albums'&&<>
            {openAlbum!=null?(()=>{
              const alb=albums[openAlbum];
              let albTracks=tracks.filter(t=>t.album===alb.id);
              albTracks = albumTrackSort==='manual' ? [...albTracks].sort((a,b)=>(a.order||0)-(b.order||0)) : sortTracks(albTracks,albumTrackSort);
              return<>
                <button className="back-btn" onClick={()=>setOpenAlbum(null)}>← Back to Albums</button>
                <div style={{display:'flex',gap:'1.5rem',alignItems:'flex-start',flexWrap:'wrap',marginBottom:'1.5rem'}}>
                  {alb.cover?<img src={alb.cover} style={{width:120,height:120,borderRadius:12,objectFit:'cover'}} alt="cover"/>:
                    <div style={{width:120,height:120,borderRadius:12,background:P.blush,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'3rem'}}>💿</div>}
                  <div>
                    <div style={{fontFamily:"'Playfair Display',serif",fontSize:'1.6rem',color:P.text,fontWeight:700}}>{alb.title}</div>
                    <div style={{color:P.textMid,fontSize:'.9rem',marginTop:4}}>{alb.artist}{alb.year?` · ${alb.year}`:''}</div>
                    {avgRating(albTracks)&&<div style={{color:P.rose,fontWeight:700,marginTop:4}}>★ {avgRating(albTracks)} avg</div>}
                    {alb.notes&&<div style={{fontSize:'.82rem',color:P.textLt,marginTop:6,fontStyle:'italic'}}>{alb.notes}</div>}
                  </div>
                </div>
                <MiniStats tracks={albTracks} moods={moods} moodColors={moodColors}/>
                <div style={{marginTop:'1.5rem'}}>
                  <div className="section-head">
                    <h2>Tracks</h2>
                    <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
                      <TrackSortSelect val={albumTrackSort} onChange={setAlbumTrackSort} withManual/>
                      {albumTrackSort==='manual'&&<span style={{fontSize:'.72rem',color:P.textLt,fontStyle:'italic'}}>drag ⠿ to reorder</span>}
                      <button className="btn-primary btn-sm" onClick={()=>{setEditTrack(null);setShowTrackForAlbum(alb);setShowTrack(true);}}>+ Add Track</button>
                    </div>
                  </div>
                  {albTracks.length===0&&<div className="empty">No tracks linked yet</div>}
                  <div className="track-list">
                    {albTracks.map(t=>{
                      const ri=tracks.indexOf(t);
                      return<TrackRow key={t.id} t={t} ri={ri} selected={selected===ri} onSelect={i=>setSelected(selected===i?null:i)} onEdit={i=>{setEditTrack(i);setShowTrack(true);}} onDel={delTrack} onHeart={toggleHeart} moodColors={moodColors} albums={albums}
                        draggable={albumTrackSort==='manual'} onDragStart={handleDragStart} onDragOver={handleDragOver} onDrop={handleDrop} isDragging={dragTrack?.id===t.id}
                        onToggleSuperlative={toggleSuperlative} showSuperlativePicker/>;
                    })}
                  </div>
                </div>
              </>;
            })():<>
              <div className="section-head">
                <h2>Albums</h2>
                <button className="btn-primary" onClick={()=>{setEditAlbum(null);setShowAlbum(true);}}>+ Add Album</button>
              </div>
              <div className="controls-row">
                <select className="select-bar" value={albumSort} onChange={e=>setAlbumSort(e.target.value)}>
                  <option value="az">A → Z</option>
                  <option value="za">Z → A</option>
                  <option value="year-new">Year (newest)</option>
                  <option value="year-old">Year (oldest)</option>
                  <option value="rating">By rating</option>
                </select>
              </div>
              {albums.length===0&&<div className="empty">No albums yet — they auto-create when you add tracks!</div>}
              <div className="album-grid">
                {sortedAlbums.map(alb=>{
                  const ai=albums.indexOf(alb);
                  const at=tracks.filter(t=>t.album===alb.id);
                  const avg=avgRating(at);
                  return(
                    <div key={alb.id} className="album-card" onClick={()=>setOpenAlbum(ai)}>
                      {alb.cover?<img src={alb.cover} style={{width:'100%',aspectRatio:'1',objectFit:'cover',borderRadius:8,marginBottom:8}} alt="cover"/>:
                        <div style={{width:'100%',aspectRatio:'1',background:P.blush,borderRadius:8,marginBottom:8,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'2.5rem'}}>💿</div>}
                      <div style={{fontFamily:"'Playfair Display',serif",fontSize:'.95rem',color:P.text,fontWeight:700}}>{alb.title}</div>
                      <div style={{fontSize:'.78rem',color:P.textMid,marginTop:2}}>{alb.artist}{alb.year?` · ${alb.year}`:''}</div>
                      {avg&&<div style={{fontSize:'.78rem',color:P.rose,fontWeight:700,marginTop:2}}>★ {avg}</div>}
                      <div style={{fontSize:'.75rem',color:P.textLt,marginTop:2}}>{at.length} track(s)</div>
                      <div style={{display:'flex',gap:6,marginTop:8,justifyContent:'center'}}>
                        <button className="btn-sec btn-sm" onClick={e=>{e.stopPropagation();setEditAlbum(ai);setShowAlbum(true);}}>Edit</button>
                        <button style={{background:'none',border:`1px solid ${P.rose}`,borderRadius:8,padding:'.3rem .6rem',fontSize:'.72rem',color:P.rose,cursor:'pointer'}} onClick={e=>{e.stopPropagation();delAlbum(ai);}}>Del</button>
                      </div>
                    </div>
                  );
                })}
              </div>
            </>}
          </>}

          {tab==='artists'&&<>
            {openArtist!=null?(()=>{
              const art=artists[openArtist];
              let artTracks=tracks.filter(t=>(t.artists||[]).some(n=>n.toLowerCase()===art.name.toLowerCase()));
              if(superlativeFilter) artTracks=artTracks.filter(t=>t.superlatives?.[superlativeFilter]);
              artTracks=sortTracks(artTracks,trackSort);
              const featTracks=sortTracks(tracks.filter(t=>(t.featArtists||[]).some(n=>n.toLowerCase()===art.name.toLowerCase())),trackSort);
              const artAlbumIds=[...new Set(tracks.filter(t=>(t.artists||[]).some(n=>n.toLowerCase()===art.name.toLowerCase())).map(t=>t.album).filter(Boolean))];
              const artAlbums=albums.filter(a=>artAlbumIds.includes(a.id)||a.artist.toLowerCase()===art.name.toLowerCase());
              const avg=artAvg(art.name);
              return<>
                <button className="back-btn" onClick={()=>setOpenArtist(null)}>← Back to Artists</button>
                <div style={{display:'flex',gap:'1.5rem',alignItems:'flex-start',flexWrap:'wrap',marginBottom:'1.5rem'}}>
                  {art.photo?<img src={art.photo} style={{width:100,height:100,borderRadius:'50%',objectFit:'cover'}} alt=""/>:
                    <div style={{width:100,height:100,borderRadius:'50%',background:P.blush,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'2.5rem',fontFamily:"'Playfair Display',serif",color:P.rose}}>{art.name[0]}</div>}
                  <div>
                    <div style={{fontFamily:"'Playfair Display',serif",fontSize:'1.6rem',color:P.text,fontWeight:700}}>{art.name}</div>
                    <div style={{color:P.textMid,fontSize:'.85rem',marginTop:4}}>{tracks.filter(t=>(t.artists||[]).some(n=>n.toLowerCase()===art.name.toLowerCase())).length} track(s) · {artAlbums.length} album(s)</div>
                    {avg&&<div style={{color:P.rose,fontWeight:700,marginTop:4}}>★ {avg} avg rating</div>}
                    {art.bio&&<div style={{fontSize:'.82rem',color:P.textLt,marginTop:6,fontStyle:'italic'}}>{art.bio}</div>}
                    {art.members?.length>0&&<div style={{display:'flex',flexWrap:'wrap',gap:6,marginTop:10}}>
                      {art.members.map((m,j)=>(
                        <div key={j} style={{display:'flex',alignItems:'center',gap:6,background:P.blush,borderRadius:20,padding:'4px 10px'}}>
                          {m.photo?<img src={m.photo} style={{width:22,height:22,borderRadius:'50%',objectFit:'cover'}} alt=""/>:
                            <div style={{width:22,height:22,borderRadius:'50%',background:P.muted,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'.7rem',color:P.cream}}>{m.name[0]}</div>}
                          <span style={{fontSize:'.78rem',color:P.text}}>{m.name}</span>
                          {m.role&&<span style={{fontSize:'.7rem',color:P.textLt}}>· {m.role}</span>}
                        </div>
                      ))}
                    </div>}
                  </div>
                </div>

                <div className="inner-tabs">
                  {['tracks','albums','features'].map(it=>(
                    <button key={it} className={`inner-tab${artistInnerTab===it?' active':''}`} onClick={()=>setArtistInnerTab(it)}>
                      {it.charAt(0).toUpperCase()+it.slice(1)}
                      <span style={{marginLeft:4,fontSize:'.72rem',opacity:.7}}>({it==='tracks'?artTracks.length:it==='albums'?artAlbums.length:featTracks.length})</span>
                    </button>
                  ))}
                </div>

                {artistInnerTab==='tracks'&&<>
                  <div className="controls-row">
                    <span style={{fontSize:'.78rem',color:P.textMid,fontWeight:700}}>Filter by:</span>
                    <button className="btn-sec btn-sm" style={!superlativeFilter?{background:P.rose,color:P.cream,borderColor:P.rose}:{}} onClick={()=>setSuperlativeFilter('')}>All</button>
                    {SUPERLATIVES.map(s=>(
                      <button key={s.key} className="btn-sec btn-sm" style={superlativeFilter===s.key?{background:P.rose,color:P.cream,borderColor:P.rose}:{}} onClick={()=>setSuperlativeFilter(s.key)}>{s.icon} {s.label}</button>
                    ))}
                  </div>
                  <MiniStats tracks={artTracks} moods={moods} moodColors={moodColors}/>
                  <div style={{marginTop:'1.25rem'}}>
                    {artTracks.length===0?<div className="empty">No tracks match this filter</div>:
                    <div className="track-list">{artTracks.map(t=>{const ri=tracks.indexOf(t);return<TrackRow key={t.id} t={t} ri={ri} selected={selected===ri} onSelect={i=>setSelected(selected===i?null:i)} onEdit={i=>{setEditTrack(i);setShowTrack(true);}} onDel={delTrack} onHeart={toggleHeart} moodColors={moodColors} albums={albums} onToggleSuperlative={toggleSuperlative}/>;})}</div>}
                  </div>
                </>}

                {artistInnerTab==='albums'&&<>
                  {artAlbums.length===0?<div className="empty">No albums linked to this artist yet</div>:
                  <div className="album-grid" style={{marginTop:'.5rem'}}>
                    {artAlbums.map(alb=>{
                      const ai=albums.indexOf(alb);
                      const at=tracks.filter(t=>t.album===alb.id);
                      const avg2=avgRating(at);
                      return(
                        <div key={alb.id} className="album-card" onClick={()=>{setTab('albums');setOpenAlbum(ai);setOpenArtist(null);}}>
                          {alb.cover?<img src={alb.cover} style={{width:'100%',aspectRatio:'1',objectFit:'cover',borderRadius:8,marginBottom:8}} alt="cover"/>:
                            <div style={{width:'100%',aspectRatio:'1',background:P.blush,borderRadius:8,marginBottom:8,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'2.5rem'}}>💿</div>}
                          <div style={{fontFamily:"'Playfair Display',serif",fontSize:'.95rem',color:P.text,fontWeight:700}}>{alb.title}</div>
                          {alb.year&&<div style={{fontSize:'.78rem',color:P.textMid,marginTop:2}}>{alb.year}</div>}
                          {avg2&&<div style={{fontSize:'.78rem',color:P.rose,fontWeight:700,marginTop:2}}>★ {avg2}</div>}
                          <div style={{fontSize:'.75rem',color:P.textLt,marginTop:2}}>{at.length} track(s)</div>
                        </div>
                      );
                    })}
                  </div>}
                </>}

                {artistInnerTab==='features'&&<>
                  {featTracks.length===0?<div className="empty">No features for this artist yet</div>:
                  <div className="track-list" style={{marginTop:'.5rem'}}>{featTracks.map(t=>{const ri=tracks.indexOf(t);return<TrackRow key={t.id} t={t} ri={ri} selected={selected===ri} onSelect={i=>setSelected(selected===i?null:i)} onEdit={i=>{setEditTrack(i);setShowTrack(true);}} onDel={delTrack} onHeart={toggleHeart} moodColors={moodColors} albums={albums} onToggleSuperlative={toggleSuperlative}/>;})}</div>}
                </>}
              </>;
            })():<>
              <div className="section-head">
                <h2>Artists & Groups</h2>
                <button className="btn-primary" onClick={()=>{setEditArtist(null);setShowArtist(true);}}>+ Add Artist</button>
              </div>
              <div className="controls-row">
                <select className="select-bar" value={artistSort} onChange={e=>setArtistSort(e.target.value)}>
                  <option value="az">A → Z</option>
                  <option value="za">Z → A</option>
                  <option value="tracks">Most tracks</option>
                  <option value="rating">By rating</option>
                </select>
              </div>
              {artists.length===0&&<div className="empty">No artists yet — add a track to auto-create one!</div>}
              <div className="artist-grid">
                {sortedArtists.map(a=>{
                  const ai=artists.indexOf(a);
                  const cnt=tracks.filter(t=>(t.artists||[]).some(n=>n.toLowerCase()===a.name.toLowerCase())).length;
                  const avg=artAvg(a.name);
                  return(
                    <div key={a.id} className="artist-card" onClick={()=>{setOpenArtist(ai);setArtistInnerTab('tracks');setSuperlativeFilter('');}}>
                      {a.photo?<img src={a.photo} style={{width:72,height:72,borderRadius:'50%',objectFit:'cover',margin:'0 auto .75rem',display:'block'}} alt=""/>:
                        <div className="artist-img-circle">{a.name[0]||'?'}</div>}
                      <div style={{fontFamily:"'Playfair Display',serif",fontSize:'1rem',color:P.text}}>{a.name}</div>
                      {a.autoCreated&&<div style={{fontSize:'.68rem',color:P.muted,marginTop:2}}>auto-linked</div>}
                      <div style={{fontSize:'.75rem',color:P.textMid,marginTop:4}}>{cnt} track(s)</div>
                      {avg&&<div style={{fontSize:'.78rem',color:P.rose,fontWeight:700,marginTop:2}}>★ {avg}</div>}
                      {a.members?.length>0&&<div style={{fontSize:'.72rem',color:P.textLt,marginTop:2}}>{a.members.length} member(s)</div>}
                      <div style={{display:'flex',gap:6,marginTop:10,justifyContent:'center'}}>
                        <button className="btn-sec btn-sm" onClick={e=>{e.stopPropagation();setEditArtist(ai);setShowArtist(true);}}>Edit</button>
                        <button style={{background:'none',border:`1px solid ${P.rose}`,borderRadius:8,padding:'.3rem .6rem',fontSize:'.72rem',color:P.rose,cursor:'pointer'}} onClick={e=>{e.stopPropagation();delArtist(ai);}}>Del</button>
                      </div>
                    </div>
                  );
                })}
              </div>
            </>}
          </>}

          {tab==='playlists'&&<>
            {openPlaylist!=null?(()=>{
              const pl=playlists[openPlaylist];
              const plTracks=sortTracks(tracks.filter(t=>(pl.trackIds||[]).includes(t.id)),trackSort);
              return<>
                <button className="back-btn" onClick={()=>setOpenPlaylist(null)}>← Back to Playlists</button>
                <div style={{display:'flex',gap:'1.5rem',alignItems:'flex-start',flexWrap:'wrap',marginBottom:'1.5rem'}}>
                  {pl.cover?<img src={pl.cover} style={{width:100,height:100,borderRadius:12,objectFit:'cover'}} alt="cover"/>:
                    <div style={{width:100,height:100,borderRadius:12,background:`linear-gradient(135deg,${P.dark},${P.rose})`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'2.5rem'}}>🎵</div>}
                  <div>
                    <div style={{fontFamily:"'Playfair Display',serif",fontSize:'1.6rem',color:P.text,fontWeight:700}}>{pl.name}</div>
                    <div style={{color:P.textMid,fontSize:'.85rem',marginTop:4}}>{plTracks.length} track(s)</div>
                    {avgRating(plTracks)&&<div style={{color:P.rose,fontWeight:700,marginTop:4}}>★ {avgRating(plTracks)} avg</div>}
                  </div>
                </div>
                <MiniStats tracks={plTracks} moods={moods} moodColors={moodColors}/>
                <div style={{marginTop:'1.5rem'}}>
                  <div className="section-head"><h2>Tracks</h2><TrackSortSelect val={trackSort} onChange={setTrackSort}/></div>
                  {plTracks.length===0?<div className="empty">No tracks in this playlist yet</div>:
                  <div className="track-list">{plTracks.map(t=>{const ri=tracks.indexOf(t);return<TrackRow key={t.id} t={t} ri={ri} selected={selected===ri} onSelect={i=>setSelected(selected===i?null:i)} onEdit={i=>{setEditTrack(i);setShowTrack(true);}} onDel={delTrack} onHeart={toggleHeart} moodColors={moodColors} albums={albums} onToggleSuperlative={toggleSuperlative}/>;})}</div>}
                </div>
              </>;
            })():<>
              <div className="section-head">
                <h2>Playlists</h2>
                <button className="btn-primary" onClick={()=>{setEditPlaylist(null);setShowPlaylist(true);}}>+ New Playlist</button>
              </div>
              <div className="controls-row">
                <select className="select-bar" value={playlistSort} onChange={e=>setPlaylistSort(e.target.value)}>
                  <option value="newest">Newest</option>
                  <option value="az">A → Z</option>
                  <option value="za">Z → A</option>
                  <option value="size">Most tracks</option>
                </select>
              </div>
              {playlists.length===0&&<div className="empty">No playlists yet — create your first!</div>}
              <div className="playlist-grid">
                {sortedPlaylists.map(pl=>{
                  const pi=playlists.indexOf(pl);
                  const pt=tracks.filter(t=>(pl.trackIds||[]).includes(t.id));
                  const avg=avgRating(pt);
                  return(
                    <div key={pl.id} className="playlist-card" onClick={()=>setOpenPlaylist(pi)}>
                      <div style={{display:'flex',gap:12,alignItems:'center',marginBottom:10}}>
                        {pl.cover?<img src={pl.cover} style={{width:56,height:56,borderRadius:8,objectFit:'cover'}} alt="cover"/>:
                          <div style={{width:56,height:56,borderRadius:8,background:`linear-gradient(135deg,${P.dark},${P.rose})`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'1.5rem',flexShrink:0}}>🎵</div>}
                        <div>
                          <div style={{fontFamily:"'Playfair Display',serif",fontSize:'1rem',color:P.text,fontWeight:700}}>{pl.name}</div>
                          <div style={{fontSize:'.78rem',color:P.textMid,marginTop:2}}>{pt.length} track(s)</div>
                          {avg&&<div style={{fontSize:'.78rem',color:P.rose,fontWeight:700}}>★ {avg}</div>}
                        </div>
                      </div>
                      <div style={{display:'flex',gap:6}}>
                        <button className="btn-sec btn-sm" onClick={e=>{e.stopPropagation();setEditPlaylist(pi);setShowPlaylist(true);}}>Edit</button>
                        <button style={{background:'none',border:`1px solid ${P.rose}`,borderRadius:8,padding:'.3rem .6rem',fontSize:'.72rem',color:P.rose,cursor:'pointer'}} onClick={e=>{e.stopPropagation();delPlaylist(pi);}}>Del</button>
                      </div>
                    </div>
                  );
                })}
              </div>
            </>}
          </>}

          {tab==='settings'&&<>
            <div className="section-head"><h2>Settings</h2></div>
            <div className="settings-section">
              <h3>Mood Labels</h3>
              <p style={{fontSize:'.85rem',color:P.textMid,marginBottom:'1rem'}}>Customize mood tags and their colors. New moods are also created on-the-fly when adding tracks.</p>
              {moods.map((m,i)=>(
                <div key={i} className="mood-item">
                  <div style={{width:18,height:18,borderRadius:'50%',background:moodColors[m]||P.rose,flexShrink:0}}/>
                  <span style={{flex:1,fontSize:'.9rem',color:P.text}}>{m}</span>
                </div>
              ))}
              <button className="btn-primary" style={{marginTop:'1rem'}} onClick={()=>setShowMoods(true)}>Edit Moods</button>
            </div>
            <div className="settings-section">
              <h3>Genre Labels</h3>
              <p style={{fontSize:'.85rem',color:P.textMid,marginBottom:'1rem'}}>These are your saved genres. New genres are created on-the-fly when adding tracks.</p>
              <div style={{display:'flex',flexWrap:'wrap',gap:6}}>{genres.map((g,i)=><span key={i} className="tag">{g}</span>)}</div>
            </div>
            <div className="settings-section">
              <h3>About Superlatives</h3>
              <p style={{fontSize:'.85rem',color:P.textMid}}>Mark tracks with album superlatives (⭐ most famous, 🥇🥈🥉 favorites, 😔 worst) from any track card. These are for fun and filtering only — they don't affect average ratings or stats.</p>
            </div>
            <div className="settings-section">
              <h3>Data</h3>
              <p style={{fontSize:'.85rem',color:P.textMid,marginBottom:'1rem'}}>Your library saves automatically in your browser's local storage.</p>
              <button className="btn-sec" style={{borderColor:P.rose,color:P.rose}} onClick={()=>{if(window.confirm('Clear ALL data? This cannot be undone.')){['vl_tracks','vl_artists','vl_albums','vl_playlists','vl_moods','vl_moodColors','vl_genres'].forEach(k=>localStorage.removeItem(k));window.location.reload();}}}>Clear all data</button>
            </div>
          </>}

        </div>

        <div className={`save-badge${saveBadge?' show':''}`}>✓ Saved</div>

        {showTrack&&<TrackModal
          initial={editTrack!=null ? tracks[editTrack] : showTrackForAlbum ? {albumTitle:showTrackForAlbum.title, albumCover:showTrackForAlbum.cover} : null}
          onSave={saveTrack}
          onClose={()=>{setShowTrack(false);setEditTrack(null);setShowTrackForAlbum(null);}}
          moods={moods} moodColors={moodColors} genres={genres} albums={albums} onNewGenre={addGenre} onNewMood={addMood}/>}
        {showArtist&&<ArtistModal initial={editArtist!=null?artists[editArtist]:null} onSave={saveArtist} onClose={()=>{setShowArtist(false);setEditArtist(null);}}/>}
        {showAlbum&&<AlbumModal initial={editAlbum!=null?albums[editAlbum]:null} onSave={saveAlbum} onClose={()=>{setShowAlbum(false);setEditAlbum(null);}}/>}
        {showPlaylist&&<PlaylistModal initial={editPlaylist!=null?playlists[editPlaylist]:null} onSave={savePlaylist} onClose={()=>{setShowPlaylist(false);setEditPlaylist(null);}} tracks={tracks}/>}
        {showMoods&&<EditListModal title="Moods" items={moods} colors={moodColors} onUpdate={updateMoods} onClose={()=>setShowMoods(false)}/>}
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
